<svg xmlns="http://www.w3.org/2000/svg" width="350" height="112" viewBox="0 0 350 112" role="img" aria-label="Most used languages">
<style>
.bg{fill:#fffefe;stroke:#e4e2e2}
.title{font:600 18px 'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif;fill:#2f80ed}
.lang{font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif;fill:#434d58}
.pct{fill:#6e7781}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}.title{fill:#58a6ff}.lang{fill:#c9d1d9}.pct{fill:#8b949e}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="349" height="111" rx="4.5"/>
<text x="25" y="35" class="title">Most Used Languages</text>
<clipPath id="bar"><rect x="25" y="50" width="300" height="8" rx="4"/></clipPath>
<g clip-path="url(#bar)"><rect x="25.00" y="50" width="300.50" height="8" fill="#3178c6"/></g>
<circle cx="30.0" cy="81" r="5" fill="#3178c6"/><text x="41.0" y="85" class="lang">TypeScript <tspan class="pct">100.0%</tspan></text>
</svg>
